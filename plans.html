<body>

<header class="header">

<nav>

<main class="section">

<h1>Instagram Growth Plans</h1>

<p>Select your preferred plan.</p>

<div class="grid">

<script>
const plans = [
["10,000 Followers",10000,500],
["25,000 Followers",25000,1000],
["65,000 Followers",65000,2500],
["75,000 Followers",75000,3000],
["100,000 Followers",100000,5000]
];

plans.forEach(p => {
document.write(`
<div class="plan-card">
<h2>${p[0]}</h2>
<h3>₹${p[2].toLocaleString("en-IN")}</h3>
<p>Instagram Growth Plan</p>
<a class="btn primary"
href="order.html?plan=${p[1]}&price=${p[2]}">
Order Now
</a>
</div>
`);
});
</script>

</div>

</main>

<script src="script.js"></script>
</body>
